[Rule]
# Adobe 放最前（组里可切 REJECT 一键断网；小火箭没有「绕过大陆」，
# 选中代理后 Adobe 的国内域名也会跟着走 Adobe 组）
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Adobe/Adobe.list,🟥 Adobe
# 私网 / 本机直连
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT
IP-CIDR,100.64.0.0/10,DIRECT
# Google 中国服务走代理（必须在国内直连之前，否则被 GEOIP,CN 抢直连）
DOMAIN-SUFFIX,services.googleapis.cn,🔎 Google
