    type: select
    proxies: [🇭🇰 HK, 🇹🇼 TW, 🇯🇵 JP, 🇸🇬 SG, 🇺🇸 US, 🧊 冷门节点, 🌐 Default]
  - name: ☁️ cloudflare
    type: select
    proxies: [🇭🇰 HK, 🇹🇼 TW, 🇯🇵 JP, 🇸🇬 SG, 🇺🇸 US, 🧊 冷门节点, 🌐 Default]
  - name: 🪟 Microsoft
    type: select
    proxies: [DIRECT, 🇭🇰 HK, 🇹🇼 TW, 🇯🇵 JP, 🇸🇬 SG, 🇺🇸 US, 🧊 冷门节点, 🌐 Default]
  - name: 🚀 手动选择
    type: select
    proxies: [♻️ 自动选择, 🇭🇰 HK, 🇹🇼 TW, 🇯🇵 JP, 🇸🇬 SG, 🇺🇸 US, 🧊 冷门节点, 🧭 手动选择, DIRECT]
  - name: 🌐 Default
    type: select
    proxies: [🇭🇰 HK, 🇹🇼 TW, 🇯🇵 JP, 🇸🇬 SG, 🇺🇸 US, 🧊 冷门节点, ♻️ 自动选择, 🧭 手动选择, DIRECT]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [🌐 Default, DIRECT, ♻️ 自动选择, 🧊 冷门节点, 🧭 手动选择, 🚀 手动选择]
  - name: 🔀 非标端口
    type: select
    proxies: [🐟 遵循规则, DIRECT]
  - name: 🐟 遵循规则
    type: select
    proxies: [🐟 漏网之鱼]
  - name: 🧭 手动选择
    type: select
    include-all: true
    exclude-filter: '(?i)(流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)'
  - name: ♻️ 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    exclude-filter: '(?i)(流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)'
  - name: 🇭🇰 HK
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: '(?i)(🇭🇰|香港|\bHK\b|hongkong|hong\s*kong)'
  - name: 🇹🇼 TW
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: '(?i)(🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet)'
  - name: 🇯🇵 JP
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: '(?i)(🇯🇵|日本|\bJP\b|tokyo|osaka)'
  - name: 🇸🇬 SG
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: '(?i)(🇸🇬|新加坡|\bSG\b|singapore)'
  - name: 🇺🇸 US
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: '(?i)(🇺🇸|美国|\bUS\b|united\s*states|los\s*angeles|san\s*jose|seattle|new\s*york)'
  - name: 🇺🇸 US手动
    type: select
    include-all: true
    filter: '(?i)(🇺🇸|美国|\bUS\b|united\s*states|los\s*angeles|san\s*jose|seattle|new\s*york)'
  - name: 🧊 冷门节点
    type: select
    include-all: true
    exclude-filter: '(?i)(🇭🇰|香港|\bHK\b|hong\s*kong|🇯🇵|日本|\bJP\b|tokyo|osaka|🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet|🇸🇬|新加坡|\bSG\b|singapore|🇺🇸|美国|\bUS\b|united\s*states|los\s*angeles|san\s*jose|seattle|new\s*york|流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)'

