- GEOIP,cloudflare,☁️ cloudflare,no-resolve
- "GEOSITE,google,\U0001F50E Google"
- "GEOIP,google,\U0001F50E Google,no-resolve"
- "GEOSITE,microsoft,\U0001FA9F Microsoft"
- "GEOIP,microsoft,\U0001FA9F Microsoft,no-resolve"
- "GEOSITE,gfw,\U0001F680 手动选择"
- "RULE-SET,Custom_Port_Direct,\U0001F500 非标端口"
- "MATCH,\U0001F41F 漏网之鱼"
redir-port: 7892
tproxy-port: 7895
mixed-port: 7893
secret: ByKqk0Bv
bind-address: "*"
external-ui: "/usr/share/openclash/ui"
external-ui-name: metacubexd
external-ui-url: https://codeload.github.com/MetaCubeX/metacubexd/zip/refs/heads/gh-pages
keep-alive-interval: 15
keep-alive-idle: 600
geox-url:
  mmdb: https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/lite/Country.mmdb
  geoip: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
  asn: https://testingcf.jsdelivr.net/gh/xishang0128/geoip@release/GeoLite2-ASN.mmdb
sniffer:
  enable: true
  override-destination: false
  sniff:
    QUIC:
      ports:
      - 443
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: false
  force-domain:
  - "+.netflix.com"
  - "+.nflxvideo.net"
  - "+.amazonaws.com"
  - "+.media.dssott.com"
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
  - "+.oray.com"
  - "+.sunlogin.net"
  - "+.push.apple.com"
  parse-pure-ip: true
profile:
  store-selected: true
  store-fake-ip: true
ntp:
  enable: true
  server: time.apple.com
  port: 123
  interval: 30
  write-to-system: true
rule-providers:
  oc-cn-domain:
    type: http
    interval: 43200
    behavior: domain
    format: mrs
    url: https://gh-proxy.com/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    path: "./rule_provider/oc-cn-domain.mrs"
  Custom_Direct_Domain:
    type: http
    behavior: domain
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml
    path: "./rule_provider/Custom_Direct_Domain.yaml"
    interval: 28800
  Custom_Direct_Classical_IP:
    type: http
    behavior: classical
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml
    path: "./rule_provider/Custom_Direct_Classical_IP.yaml"
    interval: 28800
  Custom_Proxy_Domain:
    type: http
    behavior: domain
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml
    path: "./rule_provider/Custom_Proxy_Domain.yaml"
    interval: 28800
  Custom_Proxy_Classical_IP:
    type: http
    behavior: classical
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml
    path: "./rule_provider/Custom_Proxy_Classical_IP.yaml"
    interval: 28800
  Custom_Port_Direct:
    type: http
    behavior: classical
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml
    path: "./rule_provider/Custom_Port_Direct.yaml"
    interval: 28800
authentication:
- Clash:F9iC6JWU
hosts:
  openwrt.lan: lan
  immortalwrt.lan: lan
  lede.lan: lan
  router.lan: lan
  ImmortalWrt.lan: lan
